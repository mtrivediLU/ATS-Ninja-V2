# Hand-labelled ground truth for the CGI "Senior Full Stack Developer
# (Java + Angular)" posting.
#
# WHY THIS FILE EXISTS
# --------------------
# Demand-model recall and precision are meaningless if the goalposts are drawn
# from the extractor's own output. These labels were written and committed
# BEFORE any B-1 demand-model fix, by reading job_description.txt directly --
# same discipline as the CrowdPlat/LatentView files from PR A-1.
#
# `jd_occurrences` is MEASURED, not estimated: a case-insensitive
# word-boundary count over job_description.txt, the identical method
# production uses. Three independently corroborate Jobscan's own published
# per-skill JD column exactly: Java 5, Angular 5, Spring Boot 4.
#
# A DELIBERATE DISAGREEMENT WITH JOBSCAN -- read before "fixing" this file
# ------------------------------------------------------------------------
# Jobscan's skill table also lists Teamwork (JD=1), Committed (JD=2), Build
# relationships (JD=1), and Leadership (JD=1). All four are EXCLUDED here.
# Every occurrence of "teamwork" / "committed" / "build relationships" is in
# the generic "What you can expect from us" company-culture boilerplate at
# the bottom of the posting -- not in "Your future duties and
# responsibilities" or "Required qualifications". "leadership" occurs once,
# in "You will provide technical leadership", inside the unheaded intro
# paragraph before the first recognised section heading.
#
# Jobscan is a naive keyword scanner with no section awareness; this engine's
# demand model is deliberately section-gated (`extract_requirements` mines
# only `required`/`preferred`/`responsibility` sections) specifically so
# marketing copy is never rendered to a candidate as a skill gap -- the exact
# failure class documented in test_pramana_demand.py's own module docstring
# ("modern low-code", "BI Frameworks"). Labelling boilerplate-only terms as
# ground truth here would reward the extractor for mining the wrong text.
# `communication` / `collaboration` / `stakeholder management` are kept
# because they appear in the "Required qualifications" bullet itself
# ("Excellent communication, collaboration, and stakeholder management
# skills"); `mentoring` is kept because "Mentor junior engineers..." is a
# bullet in the responsibilities section.
#
# JUDGEMENT CALLS
# ----------------
# - "REST API" / "RESTful APIs" / "RESTful (Rest-APIs)" are three spellings
#   of one skill; existing vocabulary already canonicalises this family as
#   "rest apis" (aliases: rest api, restful api, restful apis). Ground truth
#   uses that canonical, surface "RESTful APIs" (the fullest literal form),
#   counted as that literal string only -- 1 occurrence -- matching how
#   production counts a candidate's own surface, not every synonym.
# - "distributed system(s)" appears in three different inflections
#   ("distributed system challenges", "across distributed systems", "in
#   distributed environments"); ground truth picks the plural noun form,
#   "distributed systems", as the representative surface (1 occurrence of
#   that exact string).
# - "SQL/PL SQL" in the source has no slash before "PL": ground truth's
#   surface for PL/SQL is the literal "PL SQL" as written.
#
# Deliberately NOT labelled: "CGI" (the employer's own name; must never be
# mined as a requirement -- §4's documented defect), and no requirement here
# is ever a preposition-prefixed fragment ("including EKS", "including
# GitHub") -- those fragments must not appear in extraction output either.
#
# STEP 2 PRE-EXTRACTION ADDITIONS
# -------------------------------
# These additions were hand-labelled from job_description.txt before the
# Step 2 title-mining and vocabulary changes. `Full Stack` is a requirement in
# the resolved title (the later intro occurrence is an inline title
# announcement); `responsive user interfaces` is the posting's exact surface
# for the responsive-design competency. Counts use the same word-boundary
# method documented above.

