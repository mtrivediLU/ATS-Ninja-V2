# Hand-labelled ground truth for the CrowdPlat "Web Scraper / Data Extraction
# Specialist" posting.
#
# WHY THIS FILE EXISTS
# --------------------
# Demand-model recall and precision are meaningless if the goalposts are drawn
# from the extractor's own output.  These labels were written and committed
# BEFORE any extractor change, by reading job_description.txt directly.
#
# LABELLING RULE (applied uniformly to both fixture cases)
# --------------------------------------------------------
# Include a term when it names a tool, technology, standard, methodology,
# domain, or named competency that a candidate could plausibly evidence.
# Exclude section headings, KPIs/outcomes, employment terms, work modes, and
# locations -- those are the `not_requirements` list below.
#
# `jd_occurrences` is MEASURED, not estimated: a case-insensitive
# word-boundary count over job_description.txt.  Every count that overlaps
# Jobscan's published per-skill JD column matches it exactly (Python 2,
# Selenium 2, JSON 2, Excel 1, Section 508 3), which independently
# corroborates both the labels and the counting method.
#
# Deliberately NOT labelled: "web scraping" -- the phrase never appears in the
# posting (it says "Web Scraper" and "extracting data from public web
# sources").  Requiring a term the JD does not contain would unfairly punish
# the old body-only extractor. Step 2 changes that judgment for the exact
# title surface `Web Scraper`: the title is now an explicit demand source, so
# the canonical web-scraping competency is labelled below without pretending
# the literal phrase `web scraping` occurs.
#
# STEP 2 PRE-EXTRACTION ADDITIONS
# -------------------------------
# These title and parent/child annotations were written from
# job_description.txt before the Step 2 extractor changes. Parenthetical
# children retain their exact source spelling and point back to Python; counts
# remain case-insensitive word-boundary measurements.

[meta]
