# Hand-labelled ground truth for the LatentView Analytics "Analytical BI & AI"
# posting.
#
# See crowdplat_web_scraper/hand_labels.toml for the labelling rule and the
# reasoning behind pre-committing these labels.  The same rule is applied here.
#
# `jd_occurrences` is MEASURED (case-insensitive word-boundary count over
# job_description.txt).  The two highest-signal counts match Jobscan's
# published JD column exactly -- AI 9 and BI 3 -- which is the cross-check that
# these labels describe the real posting rather than the extractor's output.
#
# NOTE ON THE FOUR KNOWN JUNK TERMS
# ---------------------------------
# `BI Frameworks`, `AI Tooling Platforms`, `Required Technical Skills` and
# `modern low-code` are section labels / mangled fragments that the current
# extractor emits as requirements and the product then displays to the user as
# gaps.  They are listed under [not_requirements].  Note that `low-code` and
# `no-code` ARE genuine requirements -- the defect is the label `AI Tooling
# Platforms` and the mangled surface `modern low code`, not the concept.
#
# STEP 2 PRE-EXTRACTION ADDITIONS
# -------------------------------
# These labels were added by reading job_description.txt before title mining
# or list parsing changed. `BI` and `AI` are exact title surfaces (their counts
# are 3 and 9 across the posting); the parenthetical product names point back
# to the literal `LLMs` parent. `AI assistants` is a substantive responsibility
# in the introductory role description, not EEO/culture boilerplate.

[meta]
case = "latentview_bi_ai"
company = "LatentView Analytics"
title = "Analytical BI & AI"
jobscan_base_score = 75
jobscan_tailored_score = 73
jobscan_human_tailored_score = 83
source = "Supplied verbatim by the repository owner, 2026-07-28."

